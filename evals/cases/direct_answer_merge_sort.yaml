name: 直接回答：归并排序
tags: [smoke, direct-answer]
prompt: 请直接给我一个 Python 归并排序实现，并简要说明时间复杂度。不要读取项目文件。
assertions:
  final_text_contains:
    - merge_sort
    - O(n log n)
  tools_not_used: [read_file, glob, grep, run_command]
  no_errors: true
budgets:
  max_rounds: 2
  max_model_requests: 2
  max_tokens: 12000
  max_duration_seconds: 60
