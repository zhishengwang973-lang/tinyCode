[project]
name = "tinyCode"
version = "0.1.0"
description = "A terminal AI coding assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit>=3.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
keyring = ["keyring>=25.0,<26"]
dev = [
    "coverage[toml]>=7.6,<8",
    "mypy>=1.11,<2",
    "ruff>=0.8,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
tinyCode = "tinyCode.__main__:entry_point"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "tinyCode.tools.*",
    "tinyCode.skills.tool",
    "tinyCode.mcp.adapter",
    "tinyCode.teams.tools",
    "tinyCode.subagent.tool",
]
disable_error_code = ["override"]

[tool.coverage.run]
branch = true
source = ["tinyCode"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
