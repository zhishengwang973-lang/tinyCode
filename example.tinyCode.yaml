# TinyCode 配置文件示例
# 使用方法：复制为 .tinyCode.yaml 放在当前目录，或 ~/.tinyCode/config.yaml

providers:
  - name: claude
    protocol: anthropic
    model: claude-sonnet-4-6
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    context_window: 200000

  - name: gpt
    protocol: openai
    model: gpt-4o
    base_url: https://api.openai.com
    api_key_env: OPENAI_API_KEY
    context_window: 128000

  - name: deepseek
    protocol: deepseek
    model: deepseek-chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    context_window: 1000000

  - name: deepseek-r1
    protocol: deepseek
    model: deepseek-reasoner
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    context_window: 1000000

# 当前使用的 provider（必须是上面列表中的 name）
active_provider: claude

# 单次任务的初始软预算
max_rounds: 30

# 软预算耗尽后每次增加的轮数
round_extension: 10

# 单次任务绝对不能超过的硬上限（1-100，且不小于 max_rounds）
hard_max_rounds: 100

# 软预算耗尽时：ask 询问 / auto 自动续跑 / stop 直接暂停
round_limit_action: ask

# 默认安全等级：strict / normal / permissive
# 可在单次启动时用 tinyCode --mode <等级> 覆盖
security_level: normal

# 终端界面：stream（兼容的行式输出）/ fullscreen（滚动会话与固定输入栏）
# fullscreen 仅在真实终端中启用；IDE 控制台会自动降级到 stream。
ui_mode: stream

# 是否启用持久笔记（自动更新、读取及上下文注入）
# 仅在全局 ~/.tinyCode/config.yaml 中生效，项目配置不能覆盖
notes_enabled: true

# 本地执行 Trace（仅在全局 ~/.tinyCode/config.yaml 中生效）
# 默认只保存元数据和摘要；capture_payloads 开启后也会执行敏感字段脱敏
tracing:
  enabled: true
  capture_payloads: false
  retention_days: 14
  max_files: 100
