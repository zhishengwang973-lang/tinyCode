name: 直接回答：快速排序
tags: [direct-answer]
prompt: 请直接给出一个 Python 快速排序实现，并说明平均时间复杂度。不要读取或修改项目文件。
assertions:
  final_text_contains: [quicksort, "O(n log n)"]
  tools_not_used: [read_file, glob, grep, run_command]
  no_errors: true
budgets: {max_rounds: 2, max_model_requests: 2, max_tokens: 12000, max_duration_seconds: 60}
